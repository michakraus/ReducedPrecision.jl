name: Documentation

# The documentation embeds the figures that the experiment scripts in `scripts/` write to
# `plots/`. They change with the solver packages, so they are generated here rather than
# committed: one job per script, then one job that collects them and builds the site.
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Widened to `write` on the deploying job only.
permissions:
  contents: read

jobs:
  # One job per experiment script. Each runs the full method × precision sweep of one problem
  # and time step and writes its figures to `plots/`, which the job uploads. A script takes
  # one to two minutes on an Apple M-series machine, most of it compilation.
  figures:
    name: Figures ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One failing script must not stop the remaining figures from being generated.
      fail-fast: false
      matrix:
        script:
          - harmonic_oscillator
          - harmonic_oscillator_longtime
          - pendulum
          - pendulum_longtime
          - double_pendulum
          - double_pendulum_longtime
          - toda_lattice
          - toda_lattice_longtime
          - lotka_volterra_2d
          - lotka_volterra_2d_longtime
          - lotka_volterra_4d
          - lotka_volterra_4d_longtime
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # All jobs of this workflow share one depot cache: the default cache name includes the
      # job name and the matrix values, which would give one near-identical cache per matrix
      # cell and a cold cache in the `documenter` job.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }}
          include-matrix: false
      - name: Install dependencies
        run: julia --project --color=yes -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run the experiment script
        run: julia --project --color=yes scripts/${{ matrix.script }}.jl
      - uses: actions/upload-artifact@v7
        with:
          name: figures-${{ matrix.script }}
          path: plots/*.png
          if-no-files-found: error
          retention-days: 1

  # Collect the figures of all scripts, then build and deploy the docs.
  documenter:
    name: Documenter
    needs: figures
    # Build even when some scripts failed, so that there is a build log; `docs/make.jl` names
    # every missing figure and fails. `!cancelled()` still respects cancellation through the
    # `concurrency` group.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }}
      - name: Install dependencies
        run: |
          julia --project=docs --color=yes -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
      # Doctests are not here: they run in CI.yml, in a job pinned to one OS and one Julia version,
      # so that they produce a required status check of their own.
      - name: Collect the figures
        uses: actions/download-artifact@v8
        with:
          pattern: figures-*
          merge-multiple: true
          path: plots
      - name: Build and deploy
        run: julia --project=docs --color=yes docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          # Publish a complete site only: `needs.figures.result` is `success` exactly when every
          # matrix job succeeded.
          DEPLOY_DOCS: ${{ needs.figures.result == 'success' }}
